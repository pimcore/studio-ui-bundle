name: "Frontend Build (PR and Feature Branches)"

on:
  push:
    branches:
      - "[0-9]+.[0-9]+"
      - "feature-*"
      - "nightly"
      # TEMP (remove before merge): regenerate build-dist/build-<id>.zip on every push to
      # this PR branch — pull_request_target uses the base workflow, which has no packaging.
      - "feature/frontend-build-archive"
  pull_request_target:
    branches:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.x"
      - "*_actions"
      - "feature-*"
      - "nightly"
  workflow_dispatch:
  
env:
 BRANCH_NAME: ${{ github.head_ref || github.ref_name }} 

# The push and pull_request_target triggers both fire for pushes to a feature
# branch with an open PR, producing two concurrent runs that race to push
# auto-commits to the same branch (non-fast-forward "fetch first" failures).
# Grouping them serializes per branch; cancel-in-progress drops the stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    uses: ./.github/workflows/shared-frontend-build.yaml

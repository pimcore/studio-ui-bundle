name: "Studio Frontend Build"

on:
  # Push builds run only on version branches (which have no PR). Feature/PR
  # branches are covered by the pull_request trigger below — this avoids a
  # push run and a pull_request run landing in the same concurrency group and
  # cancelling each other (which surfaced as confusing cancelled "(push)" checks).
  push:
    branches:
      - "[0-9]+.x"
      - "[0-9]+.[0-9]+"
    paths:
      - "assets/**"
  pull_request:
    paths:
      - "assets/**"
  workflow_dispatch:

# Builds cancel superseded runs per branch; the reusable workflow serializes its
# own write (commit) jobs.
concurrency:
  group: studio-frontend-build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  studio-frontend-build:
    permissions:
      contents: write
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-studio-frontend-build.yaml@main
    with:
      working-directory: ./assets
      node-version: "24"
      build-script: ci-build
      build-output-path: ./build-dist/
      api-client: true
      test: true

name: "Studio Frontend Build"

on:
  push:
    branches:
      - "[0-9]+.[0-9]+"
      - "[0-9]+.x"
    paths:
      - "assets/**"
      - "build-dist/**"
  pull_request:
    paths:
      - "assets/**"
  workflow_dispatch:

# PR runs and push runs are grouped separately; superseded runs are cancelled —
# the newest run always builds the branch tip, so no committed output is lost.
# build-dist/** on push (not pull_request) catches stale build output after merges.
concurrency:
  group: studio-frontend-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  studio-frontend-build:
    permissions:
      contents: write
    uses: pimcore/workflows-collection-public/.github/workflows/reusable-studio-frontend-build.yaml@main
    with:
      working-directory: ./assets
      node-version: "24"
      build-script: ci-build
      build-output-path: ./build-dist/
      api-client: true
      test: true
